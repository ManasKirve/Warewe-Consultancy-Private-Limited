<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0F172A">
    <title>Newsletter Agent</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="shell">
        <header class="masthead">
            <div class="mark">NA</div>
            <div class="masthead-text">
                <span class="wordmark">Newsletter Agent</span>
                <span class="kicker">autonomous pipeline &middot; plan &rarr; research &rarr; write &rarr; review &rarr; send</span>
            </div>
        </header>

        <div class="layout">
            <aside class="rail">
                <span class="rail-title">Pipeline</span>
                <div class="rail-step"><span class="n">01</span><span class="label">Plan</span></div>
                <div class="rail-step"><span class="n">02</span><span class="label">Research</span></div>
                <div class="rail-step"><span class="n">03</span><span class="label">Summarize</span></div>
                <div class="rail-step"><span class="n">04</span><span class="label">Write</span></div>
                <div class="rail-step"><span class="n">05</span><span class="label">Critique</span></div>
                <div class="rail-step"><span class="n">06</span><span class="label">Revise</span></div>
                <div class="rail-step"><span class="n">07</span><span class="label">Send</span></div>
            </aside>

            <main>
                <h1>Give it a goal.</h1>
                <p class="lede">Set a goal. The agent handles planning, research, writing, critique, and delivery — end to end.</p>

                <form action="/run" method="post">
                    <div class="sheet">
                        <label class="field-label" for="goal">Goal</label>
                        <textarea id="goal" name="goal" rows="3">Create a weekly newsletter on latest AI agent news and send it to our subscribers.</textarea>
                    </div>

                    <div class="mode-toggle">
                        <label class="mode-option selected" id="opt-auto">
                            <input type="radio" name="mode" value="autonomous" checked onclick="selectMode('opt-auto','opt-hitl')">
                            <span class="tag">Mode 01</span>
                            <span class="title">Fully Autonomous</span>
                            <span class="desc">Runs plan &rarr; research &rarr; write &rarr; review &rarr; send with no pauses.</span>
                        </label>
                        <label class="mode-option" id="opt-hitl">
                            <input type="radio" name="mode" value="human_in_loop" onclick="selectMode('opt-hitl','opt-auto')">
                            <span class="tag">Mode 02</span>
                            <span class="title">Human-in-the-Loop</span>
                            <span class="desc">Pauses after self-critique so you can approve before it sends.</span>
                        </label>
                    </div>

                    <button type="submit">Run Agent &rarr;</button>
                </form>
            </main>
        </div>
    </div>

    <script>
        function selectMode(onId, offId) {
            document.getElementById(onId).classList.add('selected');
            document.getElementById(offId).classList.remove('selected');
        }
    </script>
</body>
</html>
